name: ci
on:
  push:
    branches: [main, s9-delete-gateway]
  pull_request:
  workflow_dispatch:
    inputs:
      load:
        description: Run the Phase 6 load and chaos bars too
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neos_admin
          POSTGRES_PASSWORD: neos_admin
          POSTGRES_DB: neos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U neos_admin -d neos" --health-interval 2s --health-retries 30
    env:
      NEOS_ADMIN_URL: postgres://neos_admin:neos_admin@localhost:5433/neos
      # backup.test dumps and restores a schema with the server's own major version.
      NEOS_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      NEOS_PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: PostgreSQL 17 client (PGDG)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # V3 contracts/manifests and registration are covered by contract.test and conformance.test.
      # The retired neop.v1 gateway descriptor generator no longer exists.
      - run: pnpm test
      - if: ${{ inputs.load }}
        run: pnpm test:load

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Every commit, not just the tip: a secret removed later is still in history.
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --source /repo --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/backend.Dockerfile -t neop-ledger-backend:ci .
      - run: docker build -f deploy/agent.Dockerfile -t neop-ledger-agent:ci .
      - run: docker build -f deploy/platform.Dockerfile -t neos-platform:ci .
      # The package sandbox needs a glibc Deno inside the backend image.
      - run: docker run --rm -w /srv/packages/neop-template --entrypoint sh neop-ledger-backend:ci -c '"$(dirname "$(node -p "require.resolve(\"deno/package.json\")")")/deno" --version'
      # Production images refuse dev credentials.
      - run: "! docker run --rm neos-platform:ci tsx scripts/migrate.ts"

  # The runtime half of network.test: build the images, bring the pilot stack up with throwaway
  # secrets and real Synapse, probe every row of the network policy from inside the containers
  # (scripts/netcheck.sh, including the egress allow-list), and tear it all down.
  netcheck:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -p neops-ci -f deploy/compose.pilot.yml -f deploy/compose.chat.yml
      COMPOSE_CHAOS: docker compose -p neops-ci -f deploy/compose.pilot.yml -f deploy/compose.chat.yml -f deploy/compose.chaos.yml
      NEOP_FILES_PUBLIC_URL: http://127.0.0.1:4101
      MATRIX_SERVER_NAME: ci.neops.test
      NEOP_PRESENCE: appservice
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway secrets
        run: |
          pnpm exec tsx scripts/gen-secrets.ts
          echo "sk-ant-ci-throwaway-$(openssl rand -hex 8)" > deploy/secrets/llm_upstream_key
          bash scripts/matrix-setup.sh deploy/compose.pilot.yml neops-ci "$MATRIX_SERVER_NAME" appservice
          # CI only: the containers run as other uids than the runner, and compose file secrets are bind mounts.
          chmod -R a+rX deploy/secrets
      - run: $COMPOSE build
      - run: $COMPOSE run --rm migrate
      - name: Start the Matrix-only stack
        run: $COMPOSE up -d --wait --wait-timeout 300 postgres pgbouncer synapse platform llm-proxy ledger-backend ledger-agent egress-proxy backup
      - run: bash scripts/netcheck.sh deploy/compose.pilot.yml,deploy/compose.chat.yml neops-ci
      # Phase 6 bar on demand: 50 SIGKILL restarts against the real containers (fake provider behind the egress proxy).
      - if: ${{ inputs.load }}
        name: Chaos (live)
        run: |
          $COMPOSE_CHAOS build fakes
          $COMPOSE_CHAOS up -d --wait --wait-timeout 300 fakes egress-proxy llm-proxy
          CHAOS_JOBS=100 CHAOS_RESTARTS=50 bash scripts/chaos-live.sh neops-ci deploy/compose.pilot.yml,deploy/compose.chat.yml,deploy/compose.chaos.yml
      - if: failure()
        run: $COMPOSE_CHAOS logs --no-color --tail 200
      - if: always()
        run: $COMPOSE_CHAOS down -v --remove-orphans
