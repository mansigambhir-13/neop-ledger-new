# NEOS + Ledger on one customer VM (D2). Network policy is the wall, not convention:
#   db      postgres/pgbouncer ↔ platform, app backends, llm-proxy, migrate  (never an agent)
#   l3      platform (gateway) ↔ app backends' L3                  (the only way into an app)
#   agent   each agent ↔ its own backend's gate                    (internal: no egress)
#   llm     agents ↔ llm-proxy                                     (session tokens only)
#   ctl     llm-proxy ↔ platform (JWKS)                            (agents are not on it)
#   web     operator console (BFF) ↔ platform desk API          (the browser's only way in)
#   outbound llm-proxy, backends ↔ egress-proxy                 (internal: their only way out)
#   egress  egress-proxy → the internet, allow-listed hosts only (NEOS_EGRESS_ALLOW)
#   telemetry services → otel-collector; prometheus → platform /metrics, <app>-metrics
#   obs     prometheus, jaeger ↔ grafana                           (observability profile)
# The model and a database role are never in the same container; no agent holds a
# provider key; package handlers run in Deno inside the backend with no permissions.
# Door credentials (v3 §12) are files in $NEOS_SECRETS_DIR/doors/<company>/[<app>/]<door>.json,
# mounted read-only into the app backend only (never an agent, never web); written by
# `scripts/deploy.sh door set`. The runner signs its assistants' LLM session tokens with its own
# key (<app>_llm_signing_key); the LLM proxy holds only the public halves (llm_runner_keys).
#
#   tsx scripts/gen-secrets.ts            # fills deploy/secrets/ (never overwrites)
#   docker compose -f deploy/compose.pilot.yml run --rm migrate
#   docker compose -f deploy/compose.pilot.yml up -d
# Optional profiles: `chat` (Matrix homeserver; also set MATRIX_* on platform),
# `observability` (collector → Jaeger, Prometheus + alert rules, Grafana with the NEOP dashboard).
name: neops

x-node: &node
  restart: unless-stopped
  stop_grace_period: 15s
  logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

# Outbound HTTP(S) from the LLM proxy and app backends: through the allow-listing egress proxy only
# (they have no route to the internet of their own). Node 24 honours these with NODE_USE_ENV_PROXY=1.
# Everything inside the stack is NO_PROXY.
x-egress-env: &egress-env
  NODE_USE_ENV_PROXY: "1"
  HTTP_PROXY: http://egress-proxy:3128
  HTTPS_PROXY: http://egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1,platform,llm-proxy,otel-collector,ledger-l3,ledger-gate,ledger-agent-rpc,ledger-agent,ledger-backend,ledger-metrics,pgbouncer,postgres

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment: { POSTGRES_USER: neos_admin, POSTGRES_DB: neos, POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin }
    command: ["postgres", "-c", "max_connections=300"]
    secrets: [pg_admin]
    networks: [db]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "neos_admin", "-d", "neos"], interval: 5s, timeout: 3s, retries: 20 }

  # Transaction pooling for every app and the platform (S8). LISTEN and the execution lock
  # bypass it with a direct session connection (NEOP_DIRECT_DB_URL).
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    secrets:
      - { source: pgbouncer_ini, target: /etc/pgbouncer/pgbouncer.ini }
      - { source: pgbouncer_userlist, target: /etc/pgbouncer/userlist.txt }
    networks: [db]
    healthcheck: { test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 6432"], interval: 5s, timeout: 3s, retries: 20 }

  migrate:
    build: { context: .., dockerfile: deploy/platform.Dockerfile }
    command: ["tsx", "scripts/migrate.ts"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NEOS_APPS: ledger
      NEOS_ADMIN_URL_FILE: /run/secrets/pg_admin_url
      NEOS_PW_NEOS_MIGRATOR_FILE: /run/secrets/pw_neos_migrator
      NEOS_PW_NEOS_APP_FILE: /run/secrets/pw_neos_app
      NEOS_PW_NEOS_RUNNER_FILE: /run/secrets/pw_neos_runner
      NEOS_PW_LEDGER_MIGRATOR_FILE: /run/secrets/pw_ledger_migrator
      NEOS_PW_LEDGER_APP_FILE: /run/secrets/pw_ledger_app
      NEOS_PW_LEDGER_RUNNER_FILE: /run/secrets/pw_ledger_runner
      NEOS_PKG_PW_KEY_LEDGER_FILE: /run/secrets/ledger_pkg_pw_key
    secrets: [pg_admin_url, pw_neos_migrator, pw_neos_app, pw_neos_runner, pw_ledger_migrator, pw_ledger_app, pw_ledger_runner, ledger_pkg_pw_key]
    networks: [db]

  # Nightly per-schema logical exports (plan §Backups): pg_dump -Fc of neos + every app schema,
  # plus one JSON export per company per app, into the `backups` volume; keeps NEOS_BACKUP_KEEP runs.
  # Restores: docs/RUNBOOK.md "Backups and restore". Only the db network; it holds the admin URL.
  backup:
    build: { context: .., dockerfile: deploy/backup.Dockerfile }
    command: ["tsx", "scripts/backup.ts", "schedule"]
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NEOS_ADMIN_URL_FILE: /run/secrets/pg_admin_url
      NEOS_BACKUP_DIR: /backups
      NEOS_BACKUP_AT: ${NEOS_BACKUP_AT:-02:00}
      NEOS_BACKUP_KEEP: ${NEOS_BACKUP_KEEP:-14}
      NEOS_BACKUP_COMPANIES: "1"
      NEOS_BACKUP_ON_START: ${NEOS_BACKUP_ON_START:-0}
      # Door credentials go into each run sealed (AES-256-GCM, doors.enc) with backup_doors_key — never in clear.
      NEOS_BACKUP_DOORS_DIR: /run/secrets/doors
      NEOS_BACKUP_DOORS_KEY_FILE: /run/secrets/backup_doors_key
      TZ: ${TZ:-UTC}
    secrets: [pg_admin_url, backup_doors_key]
    volumes: ["backups:/backups", "${NEOS_SECRETS_DIR:-./secrets}/doors:/run/secrets/doors:ro"]
    networks: [db]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  platform:
    <<: *node
    build: { context: .., dockerfile: deploy/platform.Dockerfile }
    command: ["tsx", "apps/ledger/scripts/platform.ts"]
    depends_on: { pgbouncer: { condition: service_healthy } }
    environment:
      NEOS_DB_URL_FILE: /run/secrets/neos_app_url
      NEOS_VAULT_KEYS_FILE: /run/secrets/vault_keys
      NEOS_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      # Keyrings rewrite themselves on rotation, so they live on a volume, not in a read-only secret.
      NEOS_GATEWAY_KEY_PATH: /var/lib/neos/keys/gateway-key.json
      NEOS_REGISTRY_KEY_PATH: /var/lib/neos/keys/registry-key.json
      NEOS_LLM_PROXY_URL: http://llm-proxy:4200
      # NeuralChat picks the app with this model through the proxy (keyword fallback if unset or down).
      NEOS_ROUTER_MODEL: ${NEOS_ROUTER_MODEL:-claude-sonnet-5}
      PORT: "4000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    secrets: [neos_app_url, vault_keys, metrics_token]
    volumes: [platform-keys:/var/lib/neos/keys]
    networks: [db, l3, ctl, chat, web, edge, telemetry]
    ports: ["127.0.0.1:${NEOS_PLATFORM_PORT:-4000}:4000"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12 }

  llm-proxy:
    <<: *node
    build: { context: .., dockerfile: deploy/platform.Dockerfile }
    command: ["tsx", "apps/ledger/scripts/llm-proxy.ts"]
    depends_on: { platform: { condition: service_healthy } }
    environment:
      NEOS_DB_URL_FILE: /run/secrets/neos_app_url
      NEOS_PLATFORM_URL: http://platform:4000
      # Anthropic by default. OpenRouter: URL=https://openrouter.ai/api, AUTH=bearer, MODEL_PREFIX=anthropic/
      NEOP_LLM_UPSTREAM_URL: ${NEOP_LLM_UPSTREAM_URL:-https://api.anthropic.com}
      NEOP_LLM_UPSTREAM_AUTH: ${NEOP_LLM_UPSTREAM_AUTH:-x-api-key}
      NEOP_LLM_UPSTREAM_MODEL_PREFIX: ${NEOP_LLM_UPSTREAM_MODEL_PREFIX:-}
      NEOP_LLM_UPSTREAM_KEY_FILE: /run/secrets/llm_upstream_key
      # Public halves of each runner's session-signing key: {"ledger": [<Ed25519 JWK>]}.
      NEOP_LLM_RUNNER_KEYS_FILE: /run/secrets/llm_runner_keys
      PORT: "4200"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      <<: *egress-env
    secrets: [neos_app_url, llm_upstream_key, llm_runner_keys]
    # The provider is reached through egress-proxy (outbound); no route of its own to the internet.
    networks: [db, llm, ctl, outbound, telemetry]

  ledger-backend:
    <<: *node
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    command: ["tsx", "apps/ledger/scripts/backend.ts"]
    depends_on: { platform: { condition: service_healthy } }
    environment:
      NEOP_APP_DB_URL_FILE: /run/secrets/ledger_app_url
      NEOP_RUNNER_DB_URL_FILE: /run/secrets/ledger_runner_url
      NEOP_DIRECT_DB_URL_FILE: /run/secrets/ledger_direct_url
      NEOP_SERVICE_SECRET_FILE: /run/secrets/ledger_service_secret
      NEOP_JOB_TOKEN_SECRET_FILE: /run/secrets/ledger_job_token_secret
      NEOS_PKG_PW_KEY_LEDGER_FILE: /run/secrets/ledger_pkg_pw_key
      NEOP_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      NEOS_PLATFORM_URL: http://platform:4000
      NEOP_AGENT_URL: http://ledger-agent-rpc:4103
      NEOP_GATE_URL: http://ledger-gate:4102
      # v3 §12: door credentials, read per (app, company) per call from the read-only mount below.
      NEOP_DOOR_SECRETS_DIR: /run/secrets/doors
      # v3 (S8): the runner mints each assistant session's proxy token itself (no platform call).
      NEOP_LLM_PROXY_URL: http://llm-proxy:4200
      NEOP_LLM_SIGNING_KEY_FILE: /run/secrets/ledger_llm_signing_key
      # Attached source documents are kept (WP §11): bytes on the ledger-files volume, keyed
      # ledger/<company_id>/<sha256>. For an S3-compatible bucket instead: NEOP_DOCUMENTS_BACKEND=s3
      # plus NEOP_S3_ENDPOINT, NEOP_S3_BUCKET, NEOP_S3_REGION, NEOP_S3_ACCESS_KEY_ID_FILE, NEOP_S3_SECRET_ACCESS_KEY_FILE.
      NEOP_DOCUMENTS_BACKEND: local
      NEOP_DOCUMENTS_DIR: /var/lib/neop/files
      L3_PORT: "4101"
      GATE_PORT: "4102"
      L3_HOST: ledger-l3
      GATE_HOST: ledger-gate
      # Metrics relay for Prometheus, bound on the telemetry network only (alias ledger-metrics).
      METRICS_HOST: ledger-metrics
      METRICS_PORT: "9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      <<: *egress-env
    secrets: [ledger_app_url, ledger_runner_url, ledger_direct_url, ledger_service_secret, ledger_job_token_secret, ledger_pkg_pw_key, ledger_llm_signing_key, metrics_token]
    volumes:
      - ledger-packages:/var/lib/neop/packages
      - ledger-files:/var/lib/neop/files
      # The door secret store, read-only, this backend only (never the agent, never web).
      - "${NEOS_SECRETS_DIR:-./secrets}/doors:/run/secrets/doors:ro"
    # L3 listens only on the l3 network (alias ledger-l3) and the gate only on the agent network
    # (alias ledger-gate): the gateway alone reaches L3; the agent alone reaches the gate.
    # outbound: the email and GST doors reach their providers through egress-proxy only.
    networks:
      db: {}
      l3: { aliases: [ledger-l3] }
      agent-ledger: { aliases: [ledger-gate] }
      outbound: {}
      telemetry: { aliases: [ledger-metrics] }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://ledger-l3:4101/l3/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12 }

  ledger-agent:
    <<: *node
    build: { context: .., dockerfile: deploy/agent.Dockerfile }
    command: ["tsx", "apps/ledger/scripts/agent.ts"]
    # Listens only on its own backend's network: the LLM proxy (on llm) cannot call it.
    environment: { NEOP_ALLOWED_GATE: "http://ledger-gate:4102", PORT: "4103", HOST: ledger-agent-rpc, POOL_SIZE: "5", NEOP_LLM_MODEL: claude-sonnet-5 }
    networks:
      agent-ledger: { aliases: [ledger-agent-rpc] }
      llm: {}

  # The NEOS desk (platform-owned BFF + one block renderer for every app). It reaches only the platform's desk API over
  # `web`; no database, no secrets, no route to an app backend or an agent.
  # Test harness only (profile `test`): a stand-in for the NEOS app so NEOPs can be driven end to
  # end. People use the NEOS app (neos-app-platform); this never ships as a product UI.
  web:
    <<: *node
    profiles: [test]
    build: { context: .., dockerfile: deploy/platform.Dockerfile }
    command: ["tsx", "scripts/web.ts"]
    depends_on: { platform: { condition: service_healthy } }
    environment:
      NEOS_PLATFORM_URL: http://platform:4000
      PORT: "4780"
      # A test harness, never production: it refuses NEOS_ENV=production, which the image sets.
      NEOS_ENV: test
      # Set to 1 once TLS terminates in front of it.
      NEOS_WEB_SECURE_COOKIES: "0"
    networks: [web, edge]
    ports: ["127.0.0.1:${NEOS_WEB_PORT:-4780}:4780"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4780/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12 }

  # The stack's only door to the internet (plan: egress allow-lists). Exact host names; add the
  # company's GST Suvidha Provider with NEOS_GSP_HOST, anything else deliberately with NEOS_EGRESS_EXTRA.
  egress-proxy:
    build: { context: .., dockerfile: deploy/egress-proxy.Dockerfile }
    restart: unless-stopped
    environment:
      NEOS_EGRESS_ALLOW: api.anthropic.com,openrouter.ai,api.resend.com${NEOS_GSP_HOST:+,}${NEOS_GSP_HOST:-}${NEOS_EGRESS_EXTRA:+,}${NEOS_EGRESS_EXTRA:-}
      NEOS_EGRESS_PORTS: ${NEOS_EGRESS_PORTS:-443}
    networks: [outbound, egress]
    healthcheck: { test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 3128"], interval: 30s, timeout: 3s, retries: 5, start_period: 20s, start_interval: 2s }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  # ── observability profile ─────────────────────────────────────────────────────────────────
  # Without it, spans posted to the collector are dropped by the sender (nothing listens).
  otel-collector:
    image: otel/opentelemetry-collector:0.137.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro"]
    networks: [telemetry]

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    profiles: [observability]
    restart: unless-stopped
    networks: [telemetry, obs]

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--web.enable-lifecycle"]
    secrets: [metrics_token]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [telemetry, obs]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets: [grafana_admin]
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/neop.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/neop.yml:ro
      - ./observability/neop-dashboard.json:/var/lib/grafana/dashboards/neop-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    # obs: its data sources only. edge: so its UI can be published (loopback only).
    networks: [obs, edge]
    ports: ["127.0.0.1:${NEOS_GRAFANA_PORT:-3000}:3000"]

  # The existing Matrix stack is deployed beside NEOS, never through it. Needs its own
  # homeserver.yaml and deploy/appservice.yaml registered; then set MATRIX_* on platform.
  synapse:
    image: matrixdotorg/synapse:v1.139.0
    profiles: [chat]
    networks: [chat, edge]

networks:
  db: { internal: true }
  l3: { internal: true }
  agent-ledger: { internal: true }
  llm: { internal: true }
  ctl: { internal: true }
  chat: { internal: true }
  telemetry: { internal: true }
  web: { internal: true }
  outbound: { internal: true }
  obs: { internal: true }
  edge: {}
  egress: {}

volumes:
  pgdata: {}
  platform-keys: {}
  ledger-packages: {}
  # Kept source documents (attachments); back up with pgdata — the rows name these files.
  ledger-files: {}
  backups: {}
  prometheus-data: {}
  grafana-data: {}

secrets:
  pg_admin: { file: "${NEOS_SECRETS_DIR:-./secrets}/pg_admin" }
  pg_admin_url: { file: "${NEOS_SECRETS_DIR:-./secrets}/pg_admin_url" }
  pw_neos_migrator: { file: "${NEOS_SECRETS_DIR:-./secrets}/pw_neos_migrator" }
  pw_neos_app: { file: "${NEOS_SECRETS_DIR:-./secrets}/pw_neos_app" }
  pw_neos_runner: { file: "${NEOS_SECRETS_DIR:-./secrets}/pw_neos_runner" }
  pw_ledger_migrator: { file: "${NEOS_SECRETS_DIR:-./secrets}/pw_ledger_migrator" }
  pw_ledger_app: { file: "${NEOS_SECRETS_DIR:-./secrets}/pw_ledger_app" }
  pw_ledger_runner: { file: "${NEOS_SECRETS_DIR:-./secrets}/pw_ledger_runner" }
  neos_app_url: { file: "${NEOS_SECRETS_DIR:-./secrets}/neos_app_url" }
  vault_keys: { file: "${NEOS_SECRETS_DIR:-./secrets}/vault_keys" }
  metrics_token: { file: "${NEOS_SECRETS_DIR:-./secrets}/metrics_token" }
  backup_doors_key: { file: "${NEOS_SECRETS_DIR:-./secrets}/backup_doors_key" }
  llm_runner_keys: { file: "${NEOS_SECRETS_DIR:-./secrets}/llm_runner_keys" }
  ledger_llm_signing_key: { file: "${NEOS_SECRETS_DIR:-./secrets}/ledger_llm_signing_key" }
  llm_upstream_key: { file: "${NEOS_SECRETS_DIR:-./secrets}/llm_upstream_key" }
  ledger_app_url: { file: "${NEOS_SECRETS_DIR:-./secrets}/ledger_app_url" }
  ledger_runner_url: { file: "${NEOS_SECRETS_DIR:-./secrets}/ledger_runner_url" }
  ledger_direct_url: { file: "${NEOS_SECRETS_DIR:-./secrets}/ledger_direct_url" }
  pgbouncer_ini: { file: "${NEOS_SECRETS_DIR:-./secrets}/pgbouncer_ini" }
  pgbouncer_userlist: { file: "${NEOS_SECRETS_DIR:-./secrets}/pgbouncer_userlist" }
  ledger_service_secret: { file: "${NEOS_SECRETS_DIR:-./secrets}/ledger_service_secret" }
  ledger_job_token_secret: { file: "${NEOS_SECRETS_DIR:-./secrets}/ledger_job_token_secret" }
  ledger_pkg_pw_key: { file: "${NEOS_SECRETS_DIR:-./secrets}/ledger_pkg_pw_key" }
  grafana_admin: { file: "${NEOS_SECRETS_DIR:-./secrets}/grafana_admin" }
