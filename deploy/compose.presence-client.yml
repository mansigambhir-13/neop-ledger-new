# v3 S4 · NEOP presence on the CLIENT road with an EXTERNAL homeserver (NEOP_PRESENCE=client): Ledger's ordinary
# Matrix account (the one NeuralChat #143 DMs) is served by the LEDGER BACKEND itself — /sync, one reply per message,
# jobs in ledger's own schema. Use it INSTEAD of compose.matrix-external.yml (the platform's road): the platform then
# carries no Matrix account for Ledger (no MATRIX_CLIENT_ACCOUNTS entry, no token).
#   docker compose -f deploy/compose.pilot.yml -f deploy/compose.presence-client.yml up -d
# The backend reaches the homeserver through egress-proxy (443 only): the homeserver's host must be in the
# allow-list (scripts/deploy.sh adds it to NEOS_EGRESS_EXTRA). Needs secrets/matrix_ledger_token (operator-issued).
# The account → company binding lives in ledger.installs.matrix_user: PUT /api/chat/presence {app, matrix_user}
# (deploy.sh step 8 does it). Switching back: docs/RUNBOOK.md "Chat: NEOP presence".
services:
  ledger-backend:
    environment:
      NEOP_PRESENCE: client
      NEOP_MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:?set MATRIX_HOMESERVER_URL}
      NEOP_MATRIX_CLIENT_ACCOUNTS: '[{"account":"${LEDGER_MXID:?set LEDGER_MXID}","token_file":"/run/secrets/matrix_ledger_token"}]'
      # NeuralChat waits 60 s for a reply; answer (or say we could not) before that.
      MATRIX_REPLY_DEADLINE_MS: ${MATRIX_REPLY_DEADLINE_MS:-55000}
    secrets: [ledger_app_url, ledger_runner_url, ledger_direct_url, ledger_service_secret, ledger_job_token_secret, ledger_pkg_pw_key, ledger_llm_signing_key, metrics_token, matrix_ledger_token]

secrets:
  matrix_ledger_token: { file: "${NEOS_SECRETS_DIR:-./secrets}/matrix_ledger_token" }
