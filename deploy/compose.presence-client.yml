# Production Matrix-only overlay for an EXTERNAL homeserver (v3 S5/S9).
# NeuralChat and Ledger are different ordinary Matrix accounts with different tokens:
# NeuralChat posts typed tasks as itself; Ledger's backend /syncs as itself and writes only Ledger's schema.
# The platform never holds Ledger's token, and the backend never holds NeuralChat's token.
#
#   docker compose -f deploy/compose.pilot.yml -f deploy/compose.presence-client.yml up -d
services:
  platform:
    environment:
      NEOS_NEURALCHAT_MATRIX: client
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:?set MATRIX_HOMESERVER_URL}
      MATRIX_NEURALCHAT_ACCOUNTS: '[{"account":"${NEURALCHAT_MXID:?set NEURALCHAT_MXID}","company":"${NEOS_CHAT_COMPANY:?set NEOS_CHAT_COMPANY}","token_file":"/run/secrets/matrix_neuralchat_token"}]'
      MATRIX_REPLY_DEADLINE_MS: ${MATRIX_REPLY_DEADLINE_MS:-55000}
    secrets: [neos_app_url, platform_signing_key, metrics_token, matrix_neuralchat_token]

  ledger-backend:
    environment:
      NEOP_PRESENCE: client
      NEOP_MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:?set MATRIX_HOMESERVER_URL}
      NEOP_MATRIX_CLIENT_ACCOUNTS: '[{"account":"${LEDGER_MXID:?set LEDGER_MXID}","token_file":"/run/secrets/matrix_ledger_token"}]'
      MATRIX_REPLY_DEADLINE_MS: ${MATRIX_REPLY_DEADLINE_MS:-55000}
    secrets: [ledger_app_url, ledger_runner_url, ledger_direct_url, ledger_job_token_secret, ledger_pkg_pw_key, ledger_llm_signing_key, metrics_token, matrix_ledger_token]

secrets:
  matrix_neuralchat_token: { file: "${NEOS_SECRETS_DIR:-./secrets}/matrix_neuralchat_token" }
  matrix_ledger_token: { file: "${NEOS_SECRETS_DIR:-./secrets}/matrix_ledger_token" }
