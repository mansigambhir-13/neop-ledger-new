# Chat (Phase 3) overlay: a Matrix homeserver beside NEOS, and the platform's Matrix wiring.
#   scripts/matrix-setup.sh deploy/compose.pilot.yml [project] [server name] [appservice|client]   # once
#   docker compose -f deploy/compose.pilot.yml -f deploy/compose.chat.yml up -d
# The homeserver is deployed beside NEOS, never through it: rooms are a mirror; every ask from a
# room or a DM becomes a signed, typed call through the gateway (B4).
#
# Two roads, chosen by MATRIX_MODE:
#   appservice (default)  the @neop_* namespace, one bot per app per company, the homeserver pushes to us.
#   client                one ORDINARY account per company-app install (e.g. @ledger:acme.example) with an
#                         operator-issued access token (secrets/matrix_ledger_token) and a /sync loop in the
#                         platform. 1:1 DMs from allowlisted people and bridges only (PUT /api/chat/allowlist);
#                         exactly one m.notice reply per message. A rejected token stops the client — issue a
#                         new token into the secret file and restart the platform.
services:
  synapse:
    image: matrixdotorg/synapse:v1.139.0
    restart: unless-stopped
    volumes: [synapse-data:/data]
    networks: [chat, edge]
    ports: ["127.0.0.1:8008:8008"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8008/health"], interval: 5s, timeout: 3s, retries: 30 }

  platform:
    environment:
      MATRIX_MODE: ${MATRIX_MODE:-appservice}
      MATRIX_HOMESERVER_URL: http://synapse:8008
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-acme.example}
      # appservice road
      MATRIX_HS_TOKEN_FILE: /run/secrets/matrix_hs_token
      MATRIX_AS_TOKEN_FILE: /run/secrets/matrix_as_token
      # client road: one entry per company-app install; the token is read from the secret file, never logged
      MATRIX_CLIENT_ACCOUNTS: '[{"account":"@ledger:${MATRIX_SERVER_NAME:-acme.example}","company":"${NEOS_CHAT_COMPANY:-acmetraders}","app":"ledger","token_file":"/run/secrets/matrix_ledger_token"}]'
      MATRIX_REPLY_DEADLINE_MS: "50000"
    secrets: [neos_app_url, vault_keys, metrics_token, matrix_hs_token, matrix_as_token, matrix_ledger_token]

volumes:
  synapse-data: {}

secrets:
  matrix_hs_token: { file: ./secrets/matrix_hs_token }
  matrix_as_token: { file: ./secrets/matrix_as_token }
  # client road: the operator-issued access token of @ledger (empty until issued; the client then stays off)
  matrix_ledger_token: { file: ./secrets/matrix_ledger_token }
