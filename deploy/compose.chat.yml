# Matrix-only appservice overlay with a local Synapse (v3 S5/S6/S9).
# The platform registration owns only @neuralchat_.*; Ledger's backend has its own registration and owns
# @neop_ledger_.*. Typed tasks and NEOP-to-NEOP bus events travel through Matrix; there is no gateway road.
#
#   scripts/matrix-setup.sh deploy/compose.pilot.yml
#   docker compose -f deploy/compose.pilot.yml -f deploy/compose.chat.yml up -d
services:
  synapse:
    # Selecting this overlay makes Matrix mandatory, including ordinary up/down lifecycle commands.
    profiles: !reset []
    image: matrixdotorg/synapse:v1.139.0
    restart: unless-stopped
    volumes: [synapse-data:/data]
    networks: [chat, edge]
    ports: ["127.0.0.1:8008:8008"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8008/health"], interval: 5s, timeout: 3s, retries: 30 }

  platform:
    environment:
      NEOS_NEURALCHAT_MATRIX: appservice
      MATRIX_HOMESERVER_URL: http://synapse:8008
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-acme.example}
      MATRIX_HS_TOKEN_FILE: /run/secrets/matrix_hs_token
      MATRIX_AS_TOKEN_FILE: /run/secrets/matrix_as_token
      MATRIX_REPLY_DEADLINE_MS: ${MATRIX_REPLY_DEADLINE_MS:-55000}
    secrets: [neos_app_url, platform_signing_key, metrics_token, matrix_hs_token, matrix_as_token]

  ledger-backend:
    environment:
      NEOP_PRESENCE: appservice
      NEOP_MATRIX_HOMESERVER_URL: http://synapse:8008
      NEOP_MATRIX_HS_TOKEN_FILE: /run/secrets/matrix_ledger_hs_token
      NEOP_MATRIX_AS_TOKEN_FILE: /run/secrets/matrix_ledger_as_token
      APPSERVICE_PORT: "4104"
      MATRIX_REPLY_DEADLINE_MS: ${MATRIX_REPLY_DEADLINE_MS:-55000}
    secrets: [ledger_app_url, ledger_runner_url, ledger_direct_url, ledger_job_token_secret, ledger_pkg_pw_key, ledger_llm_signing_key, metrics_token, matrix_ledger_hs_token, matrix_ledger_as_token]
    networks:
      chat: {}

  # The base verifier is client-shaped. In the local appservice topology there are deliberately no per-account
  # access-token files: Synapse authenticates the two non-overlapping appservices with their own hs/as token pairs.
  # Keep only the verifier's database secrets and skip the client-only whoami checks.
  verify:
    environment:
      NEOP_PRESENCE: appservice
      NEOS_NEURALCHAT_MATRIX: appservice
    secrets: !override [neos_app_url, ledger_runner_url]

volumes:
  synapse-data: {}

secrets:
  matrix_hs_token: { file: "${NEOS_SECRETS_DIR:-./secrets}/matrix_hs_token" }
  matrix_as_token: { file: "${NEOS_SECRETS_DIR:-./secrets}/matrix_as_token" }
  matrix_ledger_hs_token: { file: "${NEOS_SECRETS_DIR:-./secrets}/matrix_ledger_hs_token" }
  matrix_ledger_as_token: { file: "${NEOS_SECRETS_DIR:-./secrets}/matrix_ledger_as_token" }
