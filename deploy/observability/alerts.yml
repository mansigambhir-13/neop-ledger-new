# Prometheus alert rules for the NEOP pilot (plan §Observability).
groups:
  - name: neop
    rules:
      - alert: NeopAckSlow
        expr: histogram_quantile(0.95, sum by (le, app) (rate(neop_job_ack_seconds_bucket[10m]))) > 0.3
        for: 10m
        annotations: { summary: "{{ $labels.app }}: new jobs acknowledged slower than 300 ms p95" }
      - alert: NeopExecutionUnknown
        expr: sum by (app) (neop_execute_outcomes{outcome="UNKNOWN"}) > 0
        for: 30m
        annotations: { summary: "{{ $labels.app }}: an approved action has been UNKNOWN for 30 min; reconciliation has not settled it" }
      - alert: NeopExecutingStuck
        expr: sum by (app) (neop_execute_outcomes{outcome="EXECUTING"}) > 0
        for: 15m
        annotations: { summary: "{{ $labels.app }}: an approved action has been executing for 15 min" }
      - alert: NeopDeadLetters
        expr: sum by (app) (neop_dead_letters) > 0
        for: 5m
        annotations: { summary: "{{ $labels.app }}: outbox events parked; replay after fixing the cause" }
      - alert: NeopOutboxBacklog
        expr: neop_outbox_unacked > 1000
        for: 10m
        annotations: { summary: "{{ $labels.app }}: the platform is not keeping up with the outbox" }
      - alert: NeopLlmBudgetRefusals
        expr: increase(neop_llm_refused_total[1h]) > 10
        annotations: { summary: "{{ $labels.app }}: model calls refused on budget in the last hour" }
      - alert: NeopApprovalsPiling
        expr: sum by (app) (neop_approvals{status="PENDING"}) > 50
        for: 1h
        annotations: { summary: "{{ $labels.app }}: more than 50 cards waiting on people" }
