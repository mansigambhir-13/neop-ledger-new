# OpenTelemetry collector (compose profile `observability`). Services POST OTLP/JSON spans to
# :4318/v1/traces (packages/contracts/src/trace.ts); they are batched and forwarded to Jaeger.
# Metrics are not pushed: Prometheus scrapes the platform's /metrics and each backend's metrics
# listener directly (deploy/observability/prometheus.yml).
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }

processors:
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  batch: { timeout: 2s }

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

extensions:
  health_check: { endpoint: 0.0.0.0:13133 }

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
  telemetry:
    logs: { level: info }
